name: soru_takip_uygulamasi
description: "Zen Study: Offline-First, minimalist and highly optimized student study companion."
version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_card_swiper: ^7.2.0
  lottie: ^3.5.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  image_cropper: ^12.2.1
  image_painter: ^0.7.1
  pdf: ^3.13.0
  printing: ^5.15.0
  audioplayers: ^6.8.1
  fl_chart: ^1.2.0
  confetti: ^0.8.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.5.1
  smooth_page_indicator: ^3.0.0
  home_widget: ^0.10.0
  signature: ^6.4.0
  sentry_flutter: ^8.14.2
  wakelock_plus: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/
    - assets/app_icon.png
    - assets/splash_logo.png
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700



# UYGULAMA İKONU AYARLARI (Tam dolu görseli kullanır)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

# AÇILIŞ EKRANI AYARLARI (Geniş boşluklu görseli kullanır)
flutter_native_splash:
  color: "#F4F1EA"
  image: "assets/splash_logo.png"
  fullscreen: true
  android_12:
    image: "assets/splash_logo.png"
    color: "#F4F1EA"
